spec:
  replicas:
    min: 2
    max: 8
  kafka:
    pool: nav-prod
  accessPolicy:
    outbound:
      external:
        - host: dokarkiv.prod-fss-pub.nais.io
        - host: ereg-services.prod-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: db-custom-4-16384
        name: spre-gosys
        diskAutoresize: true
        pointInTimeRecovery: true
        databases:
          - name: spre-gosys
            envVarPrefix: DB
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  env:
    - name: JOARK_BASE_URL
      value: "https://dokarkiv.prod-fss-pub.nais.io"
    - name: JOARK_SCOPE
      value: "api://prod-fss.teamdokumenthandtering.dokarkiv/.default"
    - name: EREG_BASE_URL
      value: "https://ereg-services.prod-fss-pub.nais.io"
    - name: SP_FORSIKRING_SCOPE
      value: "api://prod-gcp.tbd.sp-forsikring/.default"
