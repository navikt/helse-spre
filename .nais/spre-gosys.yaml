apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  annotations:
    config.linkerd.io/proxy-outbound-connect-timeout: 10s
  name: spre-gosys
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  replicas:
    disableAutoScaling: false
    scalingStrategy:
      kafka:
        topic: tbd.rapid.v1
        consumerGroup: tbd-spre-gosys-v1
        threshold: 200
  liveness:
    path: isalive
    initialDelay: 5
  readiness:
    path: isready
    initialDelay: 5
  preStopHook:
    http:
      path: /stop
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 128Mi
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: speed-api
        - application: sprinter
        - application: sp-forsikring
  prometheus:
    enabled: true
    path: /metrics
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-spre-gosys-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: KAFKA_RESET_POLICY
      value: none
    - name: KAFKA_MAX_RECORDS
      value: "50"
    - name: KAFKA_MAX_POLL_INTERVAL_MS
      value: "500000"
    - name: SP_FORSIKRING_BASE_URL
      value: "http://sp-forsikring"
