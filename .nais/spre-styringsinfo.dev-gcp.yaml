spec:
  liveness:
    initialDelay: 60
  readiness:
    initialDelay: 60
  resources:
    limits:
      memory: 1024Mi
  kafka:
    pool: nav-dev
  azure:
    application:
      tenant: trygdeetaten.no
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: db-f1-micro
        name: spre-styringsinfo
        diskAutoresize: true
        pointInTimeRecovery: true
        databases:
          - name: spre-styringsinfo
            envVarPrefix: DATABASE
            users:
              - name: bigquery-datastream
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
          - name: cloudsql.logical_decoding
            value: "on"
  env:
    - name: NOM_API_OAUTH_SCOPE
      value: "api://dev-gcp.nom.nom-api/.default"
