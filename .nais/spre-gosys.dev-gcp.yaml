spec:
  replicas:
    min: 1
    max: 1
  kafka:
    pool: nav-dev
  azure:
    application:
      tenant: trygdeetaten.no
  accessPolicy:
    outbound:
      external:
        - host: dokarkiv-q2.dev-fss-pub.nais.io
        - host: ereg-services.dev-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: db-f1-micro
        name: spre-gosys
        diskAutoresize: true
        pointInTimeRecovery: true
        databases:
          - name: spre-gosys
            envVarPrefix: DB
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  env:
    - name: JOARK_BASE_URL
      value: "https://dokarkiv-q2.dev-fss-pub.nais.io"
    - name: JOARK_SCOPE
      value: "api://dev-fss.teamdokumenthandtering.dokarkiv/.default"
    - name: EREG_BASE_URL
      value: "https://ereg-services.dev-fss-pub.nais.io"
    - name: SP_FORSIKRING_SCOPE
      value: "api://dev-gcp.tbd.sp-forsikring/.default"
