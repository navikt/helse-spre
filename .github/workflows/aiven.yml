name: aiven - Deploy Kafka-topics

on:
  push:
    branches:
      - main
    paths:
      - '.nais/topic-spre-oppgaver.yaml'
      - '.nais/topic-spre-oppgaver.*.yaml'
      - '.nais/topic-forelagte-opplysninger.yaml'
      - '.nais/topic-forelagte-opplysninger.*.yaml'
      - '.github/workflows/aiven.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # for nais login

jobs:
  deploy:
    name: Deploy ${{ matrix.topic }} til ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        topic:
          - spre-oppgaver
          - forelagte-opplysninger
        environment:
          - dev-gcp
          - prod-gcp
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@b34afa2e28c72e92d6c3ef2f9607f982b0a8283f # v1.0.14
    with:
      manifest: .nais/topic-${{ matrix.topic }}.yaml
      environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write # for nais login
