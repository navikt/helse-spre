name: aiven - Deploy Kafka-topics

on:
  push:
    branches:
      - main
    paths:
      - 'config/oppgaver/aiven-dev-spre-oppgaver.yml'
      - 'config/oppgaver/aiven-prod-spre-oppgaver.yml'
      - 'config/sykmeldt/aiven-dev-forelagte-opplysninger.yml'
      - '.github/workflows/aiven.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # for nais login

jobs:
  deploy-dev:
    name: apply kafka-topic i dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for nais login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: NAIS login
        uses: nais/login@bb6c3e1e14e53d40d69d0d092bd2fce2e39ae3bf # v0
        with:
          team: tbd

      - name: Deploy
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: config/oppgaver/aiven-dev-spre-oppgaver.yml,config/sykmeldt/aiven-dev-forelagte-opplysninger.yml

  deploy-prod:
    name: apply kafka-topic i prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for nais login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: NAIS login
        uses: nais/login@bb6c3e1e14e53d40d69d0d092bd2fce2e39ae3bf # v0
        with:
          team: tbd

      - name: Deploy
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: config/oppgaver/aiven-prod-spre-oppgaver.yml
